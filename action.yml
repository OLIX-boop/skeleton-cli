name: astpack
description: Pack a repository into an LLM-ready prompt (Tree-sitter skeletons) and report token counts.
author: astpack contributors
branding:
  icon: package
  color: purple

inputs:
  path:
    description: Directory to pack.
    default: '.'
  args:
    description: Extra command-line arguments, e.g. "--focus src/api --comments docs --max-tokens 100k".
    default: ''
  format:
    description: Output format (markdown, xml or json).
    default: markdown
  output:
    description: Output file.
    default: astpack-output.md
  version:
    description: astpack version to run from npm.
    default: latest
  upload:
    description: Upload the packed document as a workflow artifact.
    default: 'true'
  artifact-name:
    description: Name of the uploaded artifact.
    default: astpack
  summary:
    description: Write a token summary to the job summary page.
    default: 'true'

outputs:
  output-path:
    description: Path of the packed document.
    value: ${{ steps.pack.outputs.output-path }}
  files:
    description: Number of files included.
    value: ${{ steps.pack.outputs.files }}
  tokens:
    description: Tokens of the packed document (cl100k_base).
    value: ${{ steps.pack.outputs.tokens }}
  raw-tokens:
    description: Estimated tokens of the same files as raw source (cl100k_base).
    value: ${{ steps.pack.outputs.raw-tokens }}
  saved-percent:
    description: Percentage of tokens saved compared with raw source.
    value: ${{ steps.pack.outputs.saved-percent }}

runs:
  using: composite
  steps:
    - name: Pack
      id: pack
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: |
        stats="$RUNNER_TEMP/astpack-stats.json"
        # shellcheck disable=SC2086 # INPUT_ARGS is intentionally word-split
        npx --yes "astpack@$INPUT_VERSION" "$INPUT_PATH" -f "$INPUT_FORMAT" -o "$INPUT_OUTPUT" \
          --stats-json "$stats" --no-color $INPUT_ARGS
        node "$GITHUB_ACTION_PATH/scripts/action-report.mjs" "$stats" "$INPUT_OUTPUT" "$INPUT_SUMMARY"
    - name: Upload
      if: inputs.upload == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.pack.outputs.output-path }}

schema_version: "1.0"
name: cold-start
tags: [should-fire]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    I just cloned this repository on my other laptop and I don't remember how it's organised. Give me an overview of the project structure and the main services in each area.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Skill, mcp__plugin_astpack_astpack__pack_codebase, mcp__plugin_astpack_astpack__estimate_tokens, mcp__plugin_astpack_astpack__skeleton_file]
graders:
  - type: llm
    name: overview
    criteria: The answer names the main areas (billing, auth, catalog, orders, notify, db, http, util) and the service classes in them (e.g. InvoiceService, CheckoutService).
  - type: tool_used
    name: used-astpack
    tool: mcp__plugin_astpack_astpack__pack_codebase
    arm: both

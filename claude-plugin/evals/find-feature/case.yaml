schema_version: "1.0"
name: find-feature
tags: [should-fire]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Where is the PDF of invoices generated in this codebase, and what methods does that service expose? I don't know the code yet.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Skill, mcp__plugin_astpack_astpack__pack_codebase, mcp__plugin_astpack_astpack__estimate_tokens, mcp__plugin_astpack_astpack__skeleton_file]
graders:
  - type: llm
    name: located
    criteria: The answer points to src/billing/invoice-pdf.ts and the InvoicePdfService class, and lists its methods op0 to op5 (async, taking an id string and returning a Promise of a number).
  - type: tool_used
    name: used-skeleton-file
    tool: mcp__plugin_astpack_astpack__skeleton_file
    arm: both

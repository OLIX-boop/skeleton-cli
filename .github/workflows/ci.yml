name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and smoke-test the CLI
        env:
          ASTPACK_REQUIRE_VENDORED: '1'
        run: |
          npm run build
          node dist/cli.js --version
          node dist/cli.js . --stdout -q > packed.md
          node -e "const s=require('fs').readFileSync('packed.md','utf8'); if(!s.includes('## Files') || !s.includes('{ /* ... */ }')) process.exit(1)"
        shell: bash
      - name: Install the packed tarball and run it
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/astpack-*.tgz
          ./node_modules/.bin/astpack "$GITHUB_WORKSPACE/src" --stdout -q | grep -q '{ /\* ... \*/ }'
